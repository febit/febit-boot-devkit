plugins {
  alias libs.plugins.febit.java
  alias libs.plugins.febit.maven.publish
  alias libs.plugins.febit.codegen.module
}

version = '4.1.1'

group = 'org.febit.boot.devkit'
description = 'Febit Boot Devkit'

def customPom = { Project project, MavenPom pom ->
  pom.with {
    name.set project.name
    description.set project.description
    url.set 'https://github.com/febit/febit-boot-devkit'
    organization {
      name = 'Febit'
      url = 'https://github.com/febit'
    }
    licenses {
      license {
        name = 'Apache License, Version 2.0'
        url = 'https://github.com/febit/febit-boot-devkit/blob/main/LICENSE.txt'
        distribution = 'repo'
      }
    }
    scm {
      url = 'https://github.com/febit/febit-boot-devkit'
      connection = 'scm:git:https://github.com/febit/febit-boot-devkit.git'
      developerConnection = 'scm:git:https://github.com/febit/febit-boot-devkit.git'
    }
    issueManagement {
      system = 'GitHub'
      url = 'https://github.com/febit/febit-boot-devkit/issues'
    }
    developers {
      developer {
        id = 'kurt'
        name = 'Kurt Zhu'
        email = 'kurt@febit.org'
        timezone = '+8'
      }
    }
  }
}

allprojects { subproject ->

  group = rootProject.group
  version = rootProject.version

  standardMavenPublish {
    pom {
      customPom(subproject, it)
    }
  }

  codegenModule {
    defaultTemplate = fromFile("$rootDir/gradle/module.java.tmpl")
  }

  spotless {
    java {
      licenseHeaderFile rootProject.file('gradle/license-header.txt')

      shortenFullyQualifiedTypes()

      cleanthat()
          .addMutator('SafeAndConsensual')
          .addMutator('PMD')
          .addMutator('Stream')
          .addMutator('SpotBugs')

      removeUnusedImports()
      importOrder(
          '',
          'org.febit',
          'jakarta.persistence|jakarta.validation|lombok|org.jspecify',
          'jakarta|java|javax',
          '\\#', '\\#jakarta|\\#java|\\#javax'
      )
    }
  }
}

def LIBS = libs

configure(subprojects.findAll {
  !it.name.endsWith('-bom')
}) {
  apply plugin: 'java-library'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }

    withJavadocJar()
    withSourcesJar()
  }

  dependencies {
    compileOnly 'org.febit:febit-annotations-optional'
    testCompileOnly 'org.febit:febit-annotations-optional'

    testImplementation 'org.febit:febit-commons-test'
    testRuntimeOnly 'org.slf4j:slf4j-simple'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  dependencyManagement {
    resolutionStrategy {
      cacheChangingModulesFor 0, 'seconds'
    }
    imports {
      mavenBom "${LIBS.spring.boot.deps.get()}"
      mavenBom "${LIBS.febit.commons.deps.get()}"
    }
    dependencies {
      dependency "${LIBS.embedded.postgres.get()}"
      dependency "${LIBS.febit.gradle.common.get()}"
    }
  }
}
