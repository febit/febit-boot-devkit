plugins {
  id 'java-library'
  id 'org.febit.boot.rest-client'
}

// The plugin orders lombok config generation after the codegen task.
tasks.register('generateEffectiveLombokConfig')

codegenRestClient {
  sourceProject = project(':api')
  scan('org.fixture.api')
  client {
    basePackage = 'org.fixture.client'
  }
  naming {
    global {
      replacePackage('org.fixture.api', 'org.fixture.client')
    }
  }
}
