plugins {
  id 'java-gradle-plugin'
}

description = 'Gradle plugin to generate REST clients'

gradlePlugin {
  plugins {
    restClient {
      id = 'org.febit.boot.rest-client'
      displayName = 'Febit Boot REST Client Plugin'
      description = 'REST clients codegen plugin'
      implementationClass = 'org.febit.boot.devkit.rest.client.gradle.RestClientCodegenPlugin'
    }
  }
}

dependencies {
  api 'org.febit.devkit.gradle:febit-gradle-common'
  api project(':febit-boot-devkit-rest-client-common')

  testImplementation gradleTestKit()
}
